name: CI

on:
  push:
    branches: [main, master, fix-ci-and-railway]
  pull_request:
    branches: [main, master, fix-ci-and-railway]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Required at compile time by AppConfig::from_env(). The CI doesn't run the
  # binary, but `cargo test` runs unit tests that may indirectly depend on
  # env presence.
  DUAL_CORE_PASSPHRASE: "ci-only-passphrase-do-not-use-in-prod"

jobs:
  # ------------------------------------------------------------------
  # `cargo check` runs on every push, fast feedback.
  # ------------------------------------------------------------------
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pymupdf

      - name: Set PYO3_PYTHON
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "PYO3_PYTHON=python" >> $GITHUB_ENV
          else
            echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV
          fi

      - name: Install system dependencies (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config || true
          brew install openssl@3 || true

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo check --all-targets
        run: cargo check --all-targets --message-format=short

  # ------------------------------------------------------------------
  # Lint + format gates.
  #
  # `cargo fmt --check` is intentionally non-blocking right now — the repo
  # has pre-existing whitespace inconsistencies we'll clean up later.
  # `cargo clippy` runs but only fails on actual errors, not warnings.
  # ------------------------------------------------------------------
  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt

      - name: Ensure rustfmt is installed (fallback)
        run: rustup component add rustfmt || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config



      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        # -D clippy::all denies default clippy lints without elevating rustc
        # warnings (like missing_docs) to errors. Add -D clippy::pedantic
        # after the backlog is cleaned.
        run: cargo clippy --all-targets -- -D clippy::all

  # ------------------------------------------------------------------
  # Test matrix: lib unit + integration smoke. Live AI tests stay
  # ignored in CI (they need credentials we don't ship).
  # ------------------------------------------------------------------
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pymupdf

      - name: Set PYO3_PYTHON
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "PYO3_PYTHON=python" >> $GITHUB_ENV
          else
            echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV
          fi

      - name: Install system dependencies (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config || true
          brew install openssl@3 || true

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --lib
        run: cargo test --lib --message-format=short

      - name: cargo test (integration smoke)
        run: cargo test --test runtime_smoke --message-format=short
        timeout-minutes: 10

      - name: cargo test (e2e engine — CLI subcommands)
        run: cargo test --test e2e_engine_tests --message-format=short
        timeout-minutes: 10

      - name: cargo test (workflow e2e)
        run: cargo test --test workflow_e2e --message-format=short
        timeout-minutes: 10

      - name: cargo test (engine — fallback + verification)
        run: cargo test --test cascade_fallback --test fallback_integration_tests --test engine_workflow_tests --message-format=short
        timeout-minutes: 10

      - name: cargo test (engine — font + typst)
        run: cargo test --test engine_font_analysis_tests --test engine_typst_tests --message-format=short
        timeout-minutes: 10

      - name: cargo test (PDF native + segment mapping)
        run: cargo test --test pdf_native_engine_tests --test segment_mapping --test segment_map_props --message-format=short
        timeout-minutes: 10

      - name: cargo test (GUI state)
        run: cargo test --test gui_app_state_tests --test gui_core_missing_tests --message-format=short
        timeout-minutes: 5

      - name: Verify API Keys
        run: cargo run --bin dual-core-pdf-pipeline -- verify-api-keys --json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY }}
          LLAMAPARSE_API_KEY: ${{ secrets.LLAMAPARSE_API_KEY }}
          PDFREST_API_KEY: ${{ secrets.PDFREST_API_KEY }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          PYMUPDF_PRO_KEY: ${{ secrets.PYMUPDF_PRO_KEY }}
          DOCUMENT_AI_PROJECT_ID: ${{ secrets.DOCUMENT_AI_PROJECT_ID }}
          DOCUMENT_AI_LOCATION: ${{ secrets.DOCUMENT_AI_LOCATION }}
          DOCUMENT_AI_PROCESSOR_ID: ${{ secrets.DOCUMENT_AI_PROCESSOR_ID }}
          DOCUMENT_AI_API_KEY: ${{ secrets.DOCUMENT_AI_API_KEY }}

  # ------------------------------------------------------------------
  # Security audit. Soft fail — flags advisories without blocking the
  # build. Tighten to hard-fail once the repo is stable.
  # ------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: cargo audit

  # ------------------------------------------------------------------
  # Supply chain — license checks, duplicate deps, source trust.
  # ------------------------------------------------------------------
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny check
        run: cargo deny check

  # ------------------------------------------------------------------
  # Unused dependency detection
  # ------------------------------------------------------------------
  udeps:
    name: cargo udeps
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Install cargo-udeps
        run: cargo install --locked cargo-udeps
      - name: cargo udeps
        run: cargo udeps --all-targets

  # ------------------------------------------------------------------
  # Code Coverage
  # ------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pymupdf

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
        env:
          DUAL_CORE_PASSPHRASE: "ci-only-passphrase-do-not-use-in-prod"
          PYO3_PYTHON: python3
